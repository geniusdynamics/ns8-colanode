# nginx configuration of the Colanode web client container.
# The web client is a static single page application. The API server runs
# in the same pod, so a single host name serves both: users enter
# https://<host>/config as "Server URL" at login.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # File uploads are limited by the Colanode server, not by nginx
    client_max_body_size 0;

    location = /config {
        proxy_pass http://127.0.0.1:3000;
    }

    location /client/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_request_buffering off;
        # Long lived WebSocket connections
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
